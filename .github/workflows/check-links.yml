# .github/workflows/check-links.yml
---
name: Check Links

# Checks every link in public/llms.txt against the live sites with lychee, the
# tool docs.onetimesecret.com uses for its own links. scripts/verify-llms.mjs
# already proves the links into this site name built pages; this proves the
# rest answer: the docs and API reference pages, the regional hosts, and the
# markdown copies the production CDN zone renders at index.md. Those copies are
# a paid Bunny feature, so a lapse there shows up here as 404s.
#
# llms.txt is copied to a .md file first. lychee reads .txt as plain text and
# would extract the placeholder URLs in the curl examples; as markdown it skips
# code.
#
# Runs when llms.txt changes, weekly for link rot, and on demand. A scheduled
# failure opens an issue, or comments on the one already open.
#
# Manual run (requires lychee):
#   cp public/llms.txt /tmp/llms.md
#   lychee --method get --exclude 'https://api\.onetimesecret\.com/mcp' /tmp/llms.md

on:
  pull_request:
    paths:
      - public/llms.txt
      - .github/workflows/check-links.yml
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  llms-txt:
    name: Check llms.txt links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy llms.txt to a markdown file
        run: cp public/llms.txt llms.md

      # GET rather than HEAD: the markdown copies are rendered per request, and
      # GET is what an agent sends. The MCP endpoint answers only POST, so a GET
      # gets 405; scripts/verify-llms.mjs does not check it either.
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 20
            --max-retries 3
            --method get
            --accept 200,204,206,301,302,429
            --exclude 'https://api\.onetimesecret\.com/mcp'
            llms.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open or update an issue for a scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Broken links in llms.txt";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: "automated",
              per_page: 100,
            });
            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Still failing: ${run}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body:
                  "The weekly lychee check found links in public/llms.txt that do not " +
                  `answer. Details: ${run}\n\nA 404 on every index.md link means the ` +
                  "production CDN zone stopped rendering markdown copies.",
                labels: ["automated"],
              });
            }
