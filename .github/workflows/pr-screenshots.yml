# PR Screenshots Workflow
#
# Automatically captures visual screenshots of key pages for visual regression
# testing on pull requests. This helps catch unintended UI changes.
#
# Optimizations:
# - Only runs when UI code changes (src/**)
# - Only runs on ready_for_review, or when the 'screenshots' label is added
# - Uses shallow clones for faster checkout
# - Caches the Chromium build the project's Playwright uses
# - Randomly selects one language to balance coverage vs. speed
#
# Capture runs on the project's own Playwright (scripts/pr-screenshots.mjs),
# the same version and runner image the e2e suite in ci.yml uses. It replaced
# yoavf/auto-pr-screenshots-action, which pinned Playwright 1.56: that version
# has no Chromium build for Ubuntu 26.04 (the `ubuntu-latest` image), hung
# while extracting browser archives on Node 26 (#217), and the action has had
# no release since October 2025. Everything here runs on Node 26.
#
# Security:
# - Screenshots stored only in GitHub (gh-screenshots branch)
# - No third-party capture action; the PR comment is posted with the job's own
#   GITHUB_TOKEN through actions/github-script

name: PR Screenshots

# Prevent multiple concurrent runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/pr-screenshots.mjs'
      - '.github/workflows/pr-screenshots.yml'
      - '.github/screenshots.config.yml'

jobs:
  screenshots:
    name: Capture UI Screenshots
    runs-on: ubuntu-latest

    # A healthy run finishes in about two minutes. Without a bound, a hung
    # capture step holds a runner until GitHub's six-hour default kills it,
    # and the job's logs stay unreadable until then (#217).
    timeout-minutes: 15

    env:
      SCREENSHOTS_BRANCH: gh-screenshots
      SCREENSHOTS_DIR: screenshots

    # Explicit permissions for GITHUB_TOKEN
    permissions:
      contents: write        # Push screenshots to gh-screenshots branch
      pull-requests: write   # Post comments on PR

    # Only run if:
    # 1. PR is ready for review (not draft), OR
    # 2. PR has the 'screenshots' label
    # The second clause ignores `labeled` events for any other label, which
    # would otherwise rebuild the site every time an unrelated label is added.
    if: >-
      (github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'screenshots')) &&
      (github.event.action != 'labeled' ||
      github.event.label.name == 'screenshots')

    steps:
      # Use shallow clone for faster checkout
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate Astro type definitions
      - name: Generate Astro types
        run: pnpm exec astro sync

      # Build the production site
      - name: Build site
        run: pnpm run build

      # Randomly select a supported language
      # This balances coverage (testing i18n) with speed (not testing all languages)
      - name: Select random language
        id: lang
        uses: actions/github-script@v7
        with:
          script: |
            const languages = ["en", "fr", "de", "es"];
            const selected = languages[Math.floor(Math.random() * languages.length)];
            console.log(`🌐 Selected language for screenshots: ${selected}`);
            core.setOutput('selected', selected);

      # Same cache key as the e2e job in ci.yml, so the two share a browser
      # build. Keyed on the lockfile because that is what pins the Playwright
      # version, and the Playwright version is what picks the Chromium build.
      # Expect a miss on the first run after a Playwright bump; the install
      # below is what makes a miss harmless.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # Chromium's shared libraries are apt packages under /usr/lib, which the
      # cache above does not cover, so they are installed on every runner.
      # Keeping this separate from the cached browser download means a cache
      # hit cannot leave Chromium present but unable to launch.
      - name: Install Playwright system dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium

      # Bounded because this is the step that once hung for six hours at a
      # time (#217).
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - name: Start preview server
        run: |
          # setsid puts the server in its own process group, so cleanup can
          # signal the whole tree. `pnpm preview` is only a wrapper: killing it
          # alone leaves the `astro preview` child for the runner to reap as an
          # orphan.
          setsid pnpm preview &
          echo $! > preview.pid
          # Wait for server to be ready
          echo "⏳ Waiting for server to start..."
          timeout 60 bash -c 'until curl -s http://localhost:4321 > /dev/null; do sleep 2; done'
          echo "✅ Server is ready"

      # Writes the PNGs and a manifest.json to $SCREENSHOTS_DIR. Exits 1 when
      # any configured screenshot fails, so a capture problem shows as a red
      # check; the manifest still lists what succeeded, and the steps below
      # post that along with the failures.
      - name: Capture screenshots
        id: capture
        timeout-minutes: 8
        run: >
          node scripts/pr-screenshots.mjs capture
          --lang "${{ steps.lang.outputs.selected }}"
          --config .github/screenshots.config.yml
          --out "$SCREENSHOTS_DIR"

      # Stop the preview server
      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then
            PID="$(cat preview.pid)"
            # Negative PID signals the whole process group started with setsid
            # above, so the astro child goes down with the pnpm wrapper. Falls
            # back to a plain kill if the group is already gone.
            kill -- "-$PID" 2>/dev/null || kill "$PID" 2>/dev/null || true
            rm -f preview.pid
          fi

      # Commit the PNGs to the screenshots branch under pr-<number>/<timestamp>/
      # with a pr-<number>/latest pointer, the layout the branch already has.
      # The branch is checked out into a second worktree so the PR checkout
      # stays untouched. The push is retried from the branch's new tip when
      # another PR's run pushed first.
      #
      # Skipped for a PR from a fork: GITHUB_TOKEN is read-only there whatever
      # the permissions block says, so the push could only fail. The capture
      # above still runs and still fails loud; only the publishing is skipped.
      - name: Push screenshots to branch
        id: upload
        if: >-
          ${{ !cancelled() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles(format('{0}/manifest.json', env.SCREENSHOTS_DIR)) != '' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! ls "$SCREENSHOTS_DIR"/*.png >/dev/null 2>&1; then
            echo "No screenshots to push"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          timestamp="$(date -u +%Y-%m-%dT%H-%M-%S-%3NZ)"
          target="pr-${PR_NUMBER}/${timestamp}"
          worktree="${RUNNER_TEMP}/${SCREENSHOTS_BRANCH}"

          if git fetch --depth 1 origin "$SCREENSHOTS_BRANCH"; then
            git worktree add -B "$SCREENSHOTS_BRANCH" "$worktree" "origin/$SCREENSHOTS_BRANCH"
          else
            # No such branch yet: start it empty rather than from a copy of
            # the site, which is what the old action did and what the branch
            # still carries.
            echo "Branch $SCREENSHOTS_BRANCH not found, creating it"
            git worktree add --detach "$worktree"
            git -C "$worktree" checkout -q --orphan "$SCREENSHOTS_BRANCH"
            git -C "$worktree" rm -rfq .
          fi

          stage() {
            mkdir -p "$worktree/$target"
            cp "$SCREENSHOTS_DIR"/*.png "$worktree/$target/"
            {
              echo "# Screenshots for PR #${PR_NUMBER}"
              echo
              echo "Generated on: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo
              echo "## Screenshots"
              for f in "$SCREENSHOTS_DIR"/*.png; do echo "- $(basename "$f" .png)"; done
            } > "$worktree/$target/README.md"
            printf '%s' "$timestamp" > "$worktree/pr-${PR_NUMBER}/latest"
            git -C "$worktree" add "pr-${PR_NUMBER}"
            git -C "$worktree" \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Screenshots for PR #${PR_NUMBER} (${timestamp})"
          }

          stage
          for attempt in 1 2 3; do
            if git -C "$worktree" push origin "$SCREENSHOTS_BRANCH"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "dir=$target" >> "$GITHUB_OUTPUT"
              echo "✅ Pushed $target to $SCREENSHOTS_BRANCH"
              exit 0
            fi
            echo "Push attempt $attempt rejected, retrying from the branch's new tip"
            git fetch --depth 1 origin "$SCREENSHOTS_BRANCH"
            git -C "$worktree" reset -q --hard "origin/$SCREENSHOTS_BRANCH"
            stage
          done
          echo "::error::Could not push screenshots to $SCREENSHOTS_BRANCH after 3 attempts"
          exit 1

      # One comment per PR, updated in place on later runs. Posted even when
      # capture failed partway, so the failures are visible on the PR and not
      # only in the log.
      - name: Comment on PR
        if: ${{ !cancelled() && steps.upload.outputs.pushed == 'true' }}
        env:
          IMAGE_BASE: https://github.com/${{ github.repository }}/blob/${{ env.SCREENSHOTS_BRANCH }}/${{ steps.upload.outputs.dir }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          node scripts/pr-screenshots.mjs comment
          --manifest "$SCREENSHOTS_DIR/manifest.json"
          --image-base "$IMAGE_BASE"
          --sha "${HEAD_SHA:0:7}"
          --run-url "$RUN_URL"
          > "$SCREENSHOTS_DIR/comment.md"

      - name: Post comment
        if: ${{ !cancelled() && steps.upload.outputs.pushed == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync(`${process.env.SCREENSHOTS_DIR}/comment.md`, 'utf8');
            const marker = '<!-- pr-screenshots -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
