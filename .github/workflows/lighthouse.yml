name: Lighthouse CI Test

# Prevent overlapping runs for the same ref: two runs racing on the
# results-comment lookup-then-write can each miss the other's comment and
# post duplicates instead of updating one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    # Explicit permissions for GITHUB_TOKEN: read to check out, write to post
    # the results comment (the default token permissions don't include this).
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Onetime Secret site
        run: pnpm build

      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.x autorun
        env:
          CI: true
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
        if: always()

      - name: Comment on PR with Lighthouse results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const COMMENT_MARKER = '<!-- lighthouse-ci-report -->';

            async function upsertComment(body) {
              const taggedBody = `${COMMENT_MARKER}\n${body}`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find((c) => c.body.includes(COMMENT_MARKER));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: taggedBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: taggedBody,
                });
              }
            }

            try {
              // Find the manifest file
              const reportDir = '.lighthouseci';
              const manifestPath = path.join(reportDir, 'manifest.json');

              if (!fs.existsSync(manifestPath)) {
                console.log('No Lighthouse manifest found.');
                const runId = context.runId;
                const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
                await upsertComment(
                  `## 🚦 Lighthouse Audit Results\n\n` +
                  `⚠️ No Lighthouse results were produced. The build or audit step may have failed.\n\n` +
                  `📦 [View Workflow Run](${repoUrl}/actions/runs/${runId})`
                );
                return;
              }

              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              console.log('Manifest entries:', manifest.length);

              // Get representative runs for both mobile and desktop
              const representativeRuns = manifest.filter(entry => entry.isRepresentativeRun);
              console.log('Representative runs:', representativeRuns.length);

              if (representativeRuns.length === 0) {
                console.log('No representative runs found in manifest.');
                return;
              }

              // Build comment header
              let comment = `## 🚦 Lighthouse Audit Results\n\n`;

              // Process each representative run (mobile/desktop)
              for (const run of representativeRuns) {
                // run.jsonPath is already absolute (see lighthouserc.cjs's
                // upload.target comment) — don't re-join it with reportDir.
                const lhr = JSON.parse(fs.readFileSync(run.jsonPath, 'utf8'));
                const formFactor = lhr.configSettings.formFactor || 'unknown';
                const emoji = formFactor === 'mobile' ? '📱' : '🖥️';
                // run.url is the static server's origin with a random port, so
                // only the path identifies the page across runs.
                const pagePath = new URL(run.url).pathname;

                comment += `### ${emoji} \`${pagePath}\` (${formFactor})\n\n`;

                // Score categories
                const scores = {
                  'Performance': lhr.categories.performance.score,
                  'Accessibility': lhr.categories.accessibility.score,
                  'Best Practices': lhr.categories['best-practices'].score,
                  'SEO': lhr.categories.seo.score
                };

                comment += `| Category | Score |\n| --- | --- |\n`;
                for (const [category, score] of Object.entries(scores)) {
                  const percentage = Math.round(score * 100);
                  const emoji = percentage >= 90 ? '🟢' : percentage >= 50 ? '🟡' : '🔴';
                  comment += `| ${category} | ${emoji} ${percentage} |\n`;
                }

                // Core Web Vitals
                comment += `\n**Core Web Vitals**\n\n`;
                const metrics = {
                  'First Contentful Paint': lhr.audits['first-contentful-paint'],
                  'Largest Contentful Paint': lhr.audits['largest-contentful-paint'],
                  'Cumulative Layout Shift': lhr.audits['cumulative-layout-shift'],
                  'Total Blocking Time': lhr.audits['total-blocking-time']
                };

                comment += `| Metric | Value |\n| --- | --- |\n`;
                for (const [name, audit] of Object.entries(metrics)) {
                  const emoji = audit.score >= 0.9 ? '✅' : audit.score >= 0.5 ? '⚠️' : '❌';
                  comment += `| ${name} | ${emoji} ${audit.displayValue || 'N/A'} |\n`;
                }

                // === ACCESSIBILITY ISSUES ===
                // Extract failed accessibility audits
                const a11yAudits = Object.entries(lhr.audits)
                  .filter(([id, audit]) => {
                    return audit.score !== null &&
                           audit.score < 1 &&
                           lhr.categories.accessibility.auditRefs.some(ref => ref.id === id);
                  })
                  .map(([id, audit]) => ({
                    id,
                    title: audit.title,
                    description: audit.description,
                    score: audit.score,
                    impact: audit.details?.impact || 'unknown'
                  }))
                  .sort((a, b) => a.score - b.score); // Sort by score (worst first)

                if (a11yAudits.length > 0) {
                  comment += `\n### ⚠️ Accessibility Issues (${a11yAudits.length})\n\n`;
                  comment += `<details>\n<summary>Click to expand accessibility failures</summary>\n\n`;

                  for (const audit of a11yAudits) {
                    const scorePercent = Math.round((audit.score || 0) * 100);
                    const impactEmoji = audit.impact === 'serious' ? '🔴' : audit.impact === 'moderate' ? '🟡' : '⚪';
                    comment += `#### ${impactEmoji} ${audit.title} (Score: ${scorePercent})\n`;
                    comment += `${audit.description}\n\n`;

                    // Include detailed failures from the audit if available
                    const auditDetails = lhr.audits[audit.id];
                    if (auditDetails.details && auditDetails.details.items && auditDetails.details.items.length > 0) {
                      const itemCount = auditDetails.details.items.length;
                      comment += `**${itemCount} element${itemCount > 1 ? 's' : ''} affected**\n\n`;
                    }
                  }
                  comment += `</details>\n\n`;
                } else {
                  comment += `\n### ✅ No accessibility issues detected!\n\n`;
                }

                comment += `---\n\n`;
              }

              // Add artifact download link
              const runId = context.runId;
              const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
              comment += `📦 [Download Detailed Reports](${repoUrl}/actions/runs/${runId})\n\n`;

              // Detect which form factors were tested
              const formFactors = new Set();
              for (const run of representativeRuns) {
                const lhr = JSON.parse(fs.readFileSync(run.jsonPath, 'utf8'));
                formFactors.add(lhr.configSettings.formFactor);
              }

              comment += `> Lighthouse CI ran ${representativeRuns.length} test${representativeRuns.length > 1 ? 's' : ''} `;
              comment += `(mobile ${formFactors.has('mobile') ? '✓' : '✗'}, `;
              comment += `desktop ${formFactors.has('desktop') ? '✓' : '✗'})\n`;

              // Post (or update) the comment
              await upsertComment(comment);

              console.log('✅ Successfully posted Lighthouse results to PR');

            } catch (error) {
              console.error('❌ Error creating Lighthouse comment:', error);
              // Still post a basic comment so users know to check artifacts
              try {
                const runId = context.runId;
                const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
                await upsertComment(
                  `## 🚦 Lighthouse Audit Results\n\n` +
                  `⚠️ Unable to parse Lighthouse results automatically.\n\n` +
                  `📦 [Download Full Reports](${repoUrl}/actions/runs/${runId})\n\n` +
                  `Error: ${error.message}`
                );
              } catch (commentError) {
                console.error('Failed to post fallback comment:', commentError);
              }
            }
