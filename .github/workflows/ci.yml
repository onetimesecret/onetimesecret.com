# Continuous Integration Workflow
#
# This workflow maintains professional build quality by running comprehensive
# checks on every pull request and push to main branches. It enforces the same
# quality standards as pre-commit hooks but in the CI environment.
#
# Quality Gates:
#   - TypeScript type checking (strict mode)
#   - ESLint code quality and style enforcement
#   - Astro component validation
#   - i18n translation completeness
#   - Unit tests (Vitest)
#   - Production build verification
#   - End-to-end suite in a real browser (Playwright)
#   - Dependency security audit (on PRs, only when dependencies change)
#
# Jobs run in parallel for fast feedback, with dependency caching to minimize
# execution time. The daily scheduled run is the audit alone.

name: CI - Code Quality & Build

# Prevent multiple concurrent runs for the same PR/branch. The scheduled run
# gets its own group so it can't cancel a develop push run, or be cancelled by
# one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

on:
  # Run on all PRs to main and develop branches
  pull_request:
    branches: [main, develop]

  # Run on pushes to develop (pre-production validation)
  push:
    branches: [develop]

  # Allow manual triggering
  workflow_dispatch:

  # Daily dependency audit on the default branch (develop), so a newly
  # published advisory surfaces here instead of on an unrelated PR.
  schedule:
    - cron: "23 6 * * *"

# Every job only reads the repository. Stated here so the token stays
# read-only even if the repository default changes.
permissions:
  contents: read

jobs:
  # ============================================================================
  # Type Safety & Linting
  # ============================================================================
  code-quality:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate Astro type definitions
      - name: Generate Astro types
        run: pnpm exec astro sync

      # TypeScript type checking (strict mode)
      - name: TypeScript type check
        run: pnpm run type-check

      # ESLint validation
      - name: Lint code
        run: pnpm run lint

      # Astro component validation
      - name: Astro component check
        run: pnpm run check

  # ============================================================================
  # Internationalization Validation
  # ============================================================================
  i18n-check:
    name: i18n Translation Check
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Verify all translation keys are defined
      - name: Scan for missing translations
        run: |
          echo "Checking for missing or unused translation keys..."
          pnpm run i18n:scan || {
            echo "❌ Translation issues detected!"
            echo "Run 'pnpm i18n:add' locally to add missing keys"
            exit 1
          }

  # ============================================================================
  # Unit Tests
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Includes test/unit/bimi, which pins the hash of the BIMI logo bound to
      # the Verified Mark Certificate. See docs/bimi.md.
      - name: Run unit tests
        run: pnpm run test

  # ============================================================================
  # Build Verification
  # ============================================================================
  build:
    name: Production Build
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate Astro type definitions
      - name: Generate Astro types
        run: pnpm exec astro sync

      # Verify production build succeeds
      - name: Build site
        run: pnpm run build

      # Fail if the client chunks were transpiled in a way that stops Astro
      # islands from hydrating (see scripts/verify-dist.mjs).
      - name: Verify client bundle
        run: pnpm build:verify

      # Every hreflang target the build advertises has to be a page that exists
      # and claims that URL as its canonical, and every cluster has to agree on
      # one x-default (see scripts/verify-hreflang.mjs). Before #211 the site
      # advertised 124 annotations that named something other than the page.
      - name: Verify hreflang targets
        run: pnpm build:verify:hreflang

      # The generated sitemap has to exist, list 100+ real pages rather than
      # the deleted 8-URL stub, exclude the debug/test routes, and robots.txt
      # has to point at it (see scripts/verify-sitemap.mjs). #214/#209.
      - name: Verify sitemap
        run: pnpm build:verify:sitemap

      # The BIMI logo is hashed into the Verified Mark Certificate. Anything
      # that rewrites it on the way to dist/ invalidates the certificate.
      - name: Verify BIMI assets ship byte-identical
        run: |
          for f in public/bimi/*; do
            cmp "$f" "dist/${f#public/}" || { echo "❌ $f was modified during build"; exit 1; }
          done

      # Upload build artifacts for inspection if needed
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: dist/
          retention-days: 7

  # ============================================================================
  # End-to-End Suite (browser)
  # ============================================================================
  # On 2026-09-08 a green build shipped whose Vue islands never hydrated: the
  # build, type check and unit tests cannot see that, only a browser can. This
  # job started out running only island-hydration.spec.ts as the response to
  # that incident; it now runs every spec in test/e2e/specs/ against the
  # production build on desktop and mobile Chromium, so canonical URLs, the
  # homepage, pricing and the staging banner are gated too.
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            pnpm exec playwright install chromium --with-deps
          else
            echo "Using cached Playwright browsers"
          fi

      # The Playwright config starts `pnpm preview` itself (webServer).
      - name: Run e2e suite
        run: >
          pnpm test:e2e
          --project=chromium --project="Mobile Chrome"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test/e2e/playwright-report/
          retention-days: 7

  # ============================================================================
  # Security & Dependency Audit
  # ============================================================================
  # pnpm audit checks the lockfile against the live advisory database, so its
  # result changes when an advisory is published, not only when this repo
  # changes. Advisories published on 2026-09-29 and 2026-10-01 failed every CI
  # run on every branch until #238 bumped the lockfile. A PR therefore runs the
  # audit only when it changes the dependency manifests. Push, manual and
  # scheduled runs always audit, and the daily schedule catches new advisories.
  #
  # Unlike the jobs above, this one has no schedule guard: security needs its
  # output on every event, including the scheduled run.
  dependency-changes:
    name: Detect Dependency Changes
    runs-on: ubuntu-latest
    outputs:
      audit: ${{ steps.decide.outputs.audit }}

    steps:
      # A pull_request checkout is the merge commit, so HEAD^1 is the tip of
      # the base branch and the diff is exactly what the PR would change.
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide whether to audit
        id: decide
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "Event is $GITHUB_EVENT_NAME: the audit always runs"
            echo "audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every repo file pnpm reads to resolve or audit dependencies. A new
          # one (e.g. a pnpmfile under another name) has to be added here, or
          # PRs that change it skip the audit. Pathspecs match from the repo
          # root, so a nested package.json doesn't count.
          changed=$(git diff --name-only HEAD^1 HEAD -- \
            package.json pnpm-lock.yaml pnpm-workspace.yaml \
            .npmrc .pnpmfile.cjs .pnpmfile.mjs)
          if [[ -n "$changed" ]]; then
            echo "This PR changes dependency manifests: the audit runs"
            echo "$changed"
            echo "audit=true" >> "$GITHUB_OUTPUT"
          else
            echo "This PR leaves dependency manifests alone: the audit is skipped"
            echo "audit=false" >> "$GITHUB_OUTPUT"
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: dependency-changes
    if: needs.dependency-changes.outputs.audit == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Audit dependencies for known vulnerabilities
      - name: Audit dependencies
        run: |
          echo "Running security audit..."
          pnpm audit --audit-level=moderate || {
            echo "⚠️  Security vulnerabilities detected"
            echo "Review the issues above and update dependencies as needed"
            exit 1
          }

  # ============================================================================
  # Status Summary
  # ============================================================================
  # Not run on the scheduled audit: every other job is skipped there, and the
  # run fails on its own if the audit does.
  ci-success:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs:
      - dependency-changes
      - code-quality
      - i18n-check
      - unit-tests
      - build
      - e2e
      - security
    if: always() && github.event_name != 'schedule'

    steps:
      - name: Check all jobs succeeded
        run: |
          # The audit may be skipped only when dependency-changes decided it
          # wasn't needed, which happens only on a PR. A skip anywhere else
          # means the gate was lost, so it fails.
          security_ok=false
          if [[ "${{ needs.security.result }}" == "success" ]]; then
            security_ok=true
          elif [[ "${{ needs.security.result }}" == "skipped" ]] && \
               [[ "${{ needs.dependency-changes.outputs.audit }}" == "false" ]]; then
            security_ok=true
            echo "ℹ️  Security audit skipped: no dependency changes in this PR"
          fi

          if [[ "${{ needs.dependency-changes.result }}" != "success" ]] || \
             [[ "${{ needs.code-quality.result }}" != "success" ]] || \
             [[ "${{ needs.i18n-check.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.e2e.result }}" != "success" ]] || \
             [[ "$security_ok" != "true" ]]; then
            echo "❌ One or more CI checks failed"
            echo ""
            echo "Job Status:"
            echo "  - Dependency Changes: ${{ needs.dependency-changes.result }}"
            echo "  - Code Quality: ${{ needs.code-quality.result }}"
            echo "  - i18n Check: ${{ needs.i18n-check.result }}"
            echo "  - Unit Tests: ${{ needs.unit-tests.result }}"
            echo "  - Build: ${{ needs.build.result }}"
            echo "  - End-to-End Tests: ${{ needs.e2e.result }}"
            echo "  - Security: ${{ needs.security.result }}"
            exit 1
          fi
          echo "✅ All CI checks passed successfully!"
