packages:
  - .
# Dependencies allowed to run install scripts. allowBuilds is the only key on
# purpose: pnpm 12 folds it into onlyBuiltDependencies (true) and
# ignoredBuiltDependencies (false), and only the first list decides what runs,
# so a package named in both an allowBuilds: false and an onlyBuiltDependencies
# entry was built regardless. unrs-resolver was in that position and stays
# built here; set it to false to stop building it.
allowBuilds:
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  "@eslint/plugin-kit": ^0.3.4
  # GHSA-rj75-hqrm-r3gf. typography 0.5.20 pins 6.0.10 and there is no
  # patched 6.x. Scoped so other packages keep their own major. Drop once
  # typography depends on ^7.1.6 itself.
  "@tailwindcss/typography>postcss-selector-parser": ^7.1.6
  "@ungap/structured-clone": ^1.3.1
  "@vue/devtools-kit": ^8.2.1
  "@opentelemetry/core": ^2.8
  # GHSA-3g3m-2fjr-6pw4. glob 14 is the first patched line; its only breaking
  # changes are in ignore-pattern and Windows edge cases nothing here uses.
  glob: ^14.0.2
  js-yaml: ^4.2.0
  lodash: ^4.17.23
  mdast-util-to-hast: ^13.2.1
  # GHSA-g3hv-75wg-m249. eslint, config-array, typescript-estree and
  # editorconfig declare ^10 and @eslint/eslintrc ^3; all of them only use
  # the minimatch() function and Minimatch class, which 11 keeps in both
  # its CJS and ESM builds.
  minimatch: ^11.0.1
  # GHSA-xjj6-f33q-929c and six more undici 7.x advisories patched in 7.30.1.
  undici: ^7.30.1
  yaml: ^2.8.3
  # GHSA-mrhx-c7xc-m3w5. @astrojs/sitemap and @astrojs/rss declare ^4.3.6
  # and resolved 4.5.4 while astro already had 4.6.7.
  zod: ^4.6.6
  # GHSA-w74x-v6f9-j3xg and GHSA-wjr9-j795-jxcr via ajv.
  fast-uri: ^3.1.9
# minimumReleaseAge is left at the pnpm default of 1440 minutes (1 day);
# verified against pnpm 12.4.1 (see packageManager in package.json). Setting
# it explicitly would also turn on minimumReleaseAgeStrict.
minimumReleaseAgeExclude:
  - typescript
  - typescript-eslint
  - "@playwright/test"
  - "@typescript-eslint/parser"
  - "@typescript-eslint/eslint-plugin"
  - "@typescript-eslint/project-service"
  - "@typescript-eslint/scope-manager"
  - "@typescript-eslint/tsconfig-utils"
  - "@typescript-eslint/type-utils"
  - "@typescript-eslint/types"
  - "@typescript-eslint/typescript-estree"
  - "@typescript-eslint/utils"
  - "@typescript-eslint/visitor-keys"
